<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Scanner App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .tab-buttons {
            display: flex;
            background: #f5f5f5;
        }

        .tab-button {
            flex: 1;
            padding: 15px;
            background: #f5f5f5;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
        }

        .tab-button.active {
            background: white;
            border-bottom-color: #667eea;
            color: #667eea;
        }

        .tab-content {
            display: none;
            padding: 30px;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        input[type="text"]:disabled,
        input[type="number"]:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-control input {
            flex: 1;
        }

        .quantity-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .quantity-btn:hover:not(:disabled) {
            background: #5568d3;
        }

        .quantity-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .profile-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .profile-info p {
            margin: 5px 0;
            color: #555;
        }

        .profile-info strong {
            color: #333;
        }

        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .status-message.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #6ee7b7;
        }

        .status-message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }

        .status-message.info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }

        #videoContainer {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
            display: none;
        }

        #qrVideo {
            width: 100%;
            border-radius: 8px;
        }

        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border: 3px solid #667eea;
            border-radius: 8px;
            pointer-events: none;
        }

        .scan-status {
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Inventory Scanner</h1>
            <p>Physical Inventory Recording System</p>
        </div>

        <div class="tab-buttons">
            <button class="tab-button active" onclick="switchTab('setup')">Setup Profile</button>
            <button class="tab-button" onclick="switchTab('work')">Work</button>
        </div>

        <div id="setupTab" class="tab-content active">
            <div id="setupStatus" class="status-message"></div>

            <div class="scan-status" id="scanStatus">
                <p><strong>Scanned:</strong> <span id="scannedCount">0</span> / 2 QR codes</p>
            </div>

            <div id="videoContainer">
                <video id="qrVideo"></video>
                <div class="scan-overlay"></div>
            </div>

            <button class="btn btn-primary" onclick="startQRScanning()">
                📷 Start QR Code Scanning
            </button>

            <button class="btn btn-secondary" onclick="stopQRScanning()">
                ⏹️ Stop Scanning
            </button>

            <div id="profilePreview" style="display: none; margin-top: 20px;">
                <h3 style="margin-bottom: 15px;">Profile Preview</h3>
                <div class="profile-info">
                    <p><strong>API Endpoint:</strong> <span id="previewEndpoint">-</span></p>
                    <p><strong>Order No:</strong> <span id="previewOrderNo">-</span></p>
                    <p><strong>Recording No:</strong> <span id="previewRecordingNo">-</span></p>
                    <p><strong>Location Code:</strong> <span id="previewLocationCode">-</span></p>
                </div>
                <button class="btn btn-primary" onclick="saveProfile()">
                    💾 Save Profile
                </button>
            </div>
        </div>

        <div id="workTab" class="tab-content">
            <div id="workStatus" class="status-message"></div>

            <div id="currentProfile" class="profile-info" style="display: none;">
                <h3 style="margin-bottom: 10px;">Active Profile</h3>
                <p><strong>Order No:</strong> <span id="activeOrderNo">-</span></p>
                <p><strong>Recording No:</strong> <span id="activeRecordingNo">-</span></p>
                <p><strong>Location Code:</strong> <span id="activeLocationCode">-</span></p>
                <button class="btn btn-danger" onclick="deleteProfile()" style="margin-top: 10px;">
                    🗑️ Delete Profile
                </button>
            </div>

            <div id="workForm" style="display: none;">
                <div class="form-group">
                    <label>Package No.</label>
                    <input type="text" id="packageNo" placeholder="Enter or scan package number">
                    <button class="btn btn-secondary" onclick="startBarcodeScanning()">
                        📷 Scan Barcode
                    </button>
                </div>

                <div id="barcodeVideoContainer" style="display: none; margin-bottom: 20px;">
                    <video id="barcodeVideo" style="width: 100%; border-radius: 8px;"></video>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="packageIntact" onchange="toggleQuantityField()">
                        <label for="packageIntact" style="margin: 0;">Package Intact</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Quantity</label>
                    <div class="quantity-control">
                        <button class="quantity-btn" id="minusBtn" onclick="adjustQuantity(-1)">−</button>
                        <input type="number" id="quantity" value="0" min="0">
                        <button class="quantity-btn" id="plusBtn" onclick="adjustQuantity(1)">+</button>
                    </div>
                </div>

                <button class="btn btn-primary" onclick="submitRecord()">
                    ✅ Submit Record
                </button>
            </div>

            <div id="noProfileMessage" style="text-align: center; padding: 40px;">
                <p style="color: #999; font-size: 18px;">No profile found. Please set up a profile first.</p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="app.js"></script>
</body>
</html>

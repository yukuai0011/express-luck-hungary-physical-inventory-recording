[package]
name = "inventory_scanner"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.6" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Local storage for persistence in web/webview
gloo-storage = { version = "0.2", features = ["serde"] }
# JS/WASM interop for scanning bridge
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "CustomEvent", "Navigator", "MediaDevices", "console"] }
uuid = { version = "1", features = ["v4", "js"] }
console_error_panic_hook = "0.1"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile.release]
opt-level = "z"
codegen-units = 1
lto = true

# HTTP client selection per-target
[target.'cfg(target_arch = "wasm32")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Windows Scanner</title>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: #111; color: #eee; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #wrap { display: flex; flex-direction: column; height: 100%; }
    header { padding: 10px 14px; background: #1d1d1d; border-bottom: 1px solid #333; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
    #video { width: 100%; height: 100%; object-fit: cover; }
    #overlay { position: absolute; bottom: 16px; left: 16px; right: 16px; background: rgba(0,0,0,0.6); padding: 12px; border-radius: 8px; font-size: 14px; }
    #start { margin-right: 8px; }
  </style>
</head>
<body>
  <div id="wrap">
    <header>
      <button id="start">Start</button>
      <select id="cameras" title="Camera device"></select>
      <span id="status">Idle</span>
    </header>
    <main>
      <video id="video" muted autoplay playsinline></video>
      <div id="overlay">If camera does not start, check Windows Settings → Privacy & security → Camera and allow desktop apps. WebView2 may show a permission prompt near the top edge.</div>
    </main>
  </div>
  <script src="https://unpkg.com/@zxing/library@0.21.3"></script>
  <script>
    const ZX = window.ZXing;
    const video = document.getElementById('video');
    const startBtn = document.getElementById('start');
    const cameras = document.getElementById('cameras');
    const statusEl = document.getElementById('status');

    let codeReader;
    let currentDeviceId = null;

    async function listCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const vids = devices.filter(d => d.kind === 'videoinput');
        cameras.innerHTML = '';
        vids.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v.deviceId;
          opt.textContent = v.label || `Camera ${cameras.length + 1}`;
          cameras.appendChild(opt);
        });
        if (vids.length > 0) currentDeviceId = vids[0].deviceId;
      } catch (e) {
        console.error(e);
        statusEl.textContent = 'Failed to enumerate cameras: ' + e;
      }
    }

    cameras.addEventListener('change', () => {
      currentDeviceId = cameras.value;
      startScan();
    });

    async function startScan() {
      try {
        statusEl.textContent = 'Starting camera…';
        if (!codeReader) codeReader = new ZX.BrowserMultiFormatReader();
        await codeReader.reset();
        const deviceId = currentDeviceId;
        const result = await codeReader.decodeFromVideoDevice(deviceId, video, (res, err, controls) => {
          if (res && res.getText) {
            try {
              if (window.chrome && window.chrome.webview && window.chrome.webview.postMessage) {
                window.chrome.webview.postMessage({ type: 'scan', text: res.getText() });
              }
            } catch (e) { console.error('postMessage failed', e); }
          }
          if (err && !(err instanceof ZX.NotFoundException)) {
            console.warn(err);
          }
        });
      } catch (e) {
        console.error(e);
        statusEl.textContent = 'Camera error: ' + e;
      }
    }

    startBtn.addEventListener('click', async () => {
      await listCameras();
      await startScan();
    });

    // try auto-start
    (async () => {
      await listCameras();
      await startScan();
    })();
  </script>
</body>
</html>

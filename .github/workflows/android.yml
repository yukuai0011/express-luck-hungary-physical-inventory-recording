name: Build Android APK (Tauri)

on:
  push:
    branches:
      - '**'
  workflow_dispatch: {}

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (cmdline-tools + base)
        uses: android-actions/setup-android@v3
        with:
          # We'll install specific packages with sdkmanager below
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list || true
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.2.11394342"

      - name: Set ANDROID_HOME and NDK_HOME
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/$(ls -1 "$ANDROID_SDK_ROOT/ndk" | head -n 1)" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install app dependencies
        run: |
          npm install

      - name: Initialize Android project (Tauri)
        run: |
          npx tauri android init --ci --force

      - name: Build Android APK (release)
        run: |
          npx tauri android build -- --release

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK=$(ls -1 src-tauri/gen/android/app/build/outputs/apk/release/*.apk | head -n 1 || true)
          if [ -z "$APK" ]; then
            # Fallback to debug if release not found
            APK=$(ls -1 src-tauri/gen/android/app/build/outputs/apk/debug/*.apk | head -n 1)
            echo "path=$APK" >> $GITHUB_OUTPUT
          else
            echo "path=$APK" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: ${{ steps.apk.outputs.path }}

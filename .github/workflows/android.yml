name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Add Rust Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android

      - name: Install JS dependencies
        run: npm install

      - name: Warm up Tauri CLI
        run: npx -y @tauri-apps/cli@^2 --version

      - name: Initialize Android project (first run)
        run: npx tauri android init --ci --force
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.NDK_HOME }}

      - name: Build Android APKs (split per ABI)
        run: npx tauri android build --apk --split-per-abi
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.NDK_HOME }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.NDK_HOME }}

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

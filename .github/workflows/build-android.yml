name: Build Android APK (Dioxus)

on:
  push:
    branches: [ main, "**" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install dx CLI
        run: cargo install --git https://github.com/DioxusLabs/dioxus dioxus-cli --locked

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install Android NDK and tools
        run: |
          sdkmanager "ndk;25.2.9519653" "platforms;android-34" "build-tools;34.0.0" "platform-tools" "cmdline-tools;latest"

      - name: Set ANDROID/NDK env
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "PATH=$PATH:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools" >> $GITHUB_ENV

      - name: Add Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Bundle Android APK
        run: |
          dx bundle --platform android --package-types apk --json-output --verbose | tee bundle.log

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inventory-scanner-apk
          path: |
            target/dx/**/bundle/android/**/*.apk
          retention-days: 30

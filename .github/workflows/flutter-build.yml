name: Build Flutter APK, Windows EXE, and Web

on:
  push:
  pull_request:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
        shell: bash

      - name: Flutter pub get
        run: flutter pub get

      - name: Ensure platform folders
        run: flutter create .

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
        shell: pwsh

      - name: Flutter pub get
        run: flutter pub get
        shell: pwsh

      - name: Ensure platform folders
        run: flutter create .
        shell: pwsh

      - name: Build Windows (release)
        run: flutter build windows --release
        shell: pwsh

      - name: Package Windows Release (zip full folder)
        run: |
          pwsh -File scripts/package-windows.ps1 -Configuration Release
        shell: pwsh

      - name: Upload Windows portable zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-zip
          path: artifacts/express_luck_inventory-windows-Release.zip

  web:
    name: Web (release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Web support
        run: flutter config --enable-web
        shell: bash

      - name: Flutter pub get
        run: flutter pub get
        shell: bash

      - name: Ensure platform folders
        run: flutter create .
        shell: bash

      - name: Build Web (release)
        run: flutter build web --release --web-renderer html --pwa-strategy=none
        shell: bash

      - name: Inject dynamic base-href (works locally and on GitHub Pages)
        run: |
          set -e
          SCRIPT='\n  <script>\n  (function() {\n    try {\n      var base = "/";\n      if (location.protocol === "file:") {\n        base = "./";\n      } else {\n        var path = location.pathname;\n        if (!path.endsWith("/")) {\n          path = path.substring(0, path.lastIndexOf("/") + 1);\n        }\n        base = path;\n      }\n      var el = document.querySelector("base");\n      if (!el) {\n        el = document.createElement("base");\n        document.head.insertBefore(el, document.head.firstChild);\n      }\n      el.setAttribute("href", base);\n    } catch (e) {\n      console.error("Failed to set dynamic base-href:", e);\n    }\n  })();\n  </script>'
          # Insert before the bootstrap script to ensure it takes effect
          awk -v script="$SCRIPT" '/<script src="flutter_bootstrap.js"/{print script} {print}' build/web/index.html > build/web/index.html.tmp
          mv build/web/index.html.tmp build/web/index.html
        shell: bash

      - name: Upload Web artifact (universal)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: build/web
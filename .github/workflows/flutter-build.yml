name: Build Flutter APK and Windows EXE

on:
  push:
  pull_request:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
        shell: bash

      - name: Flutter pub get
        run: flutter pub get

      - name: Ensure platform folders
        run: flutter create .

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
        shell: pwsh

      - name: Flutter pub get
        run: flutter pub get
        shell: pwsh

      - name: Ensure platform folders
        run: flutter create .
        shell: pwsh

      - name: Build Windows (release)
        run: flutter build windows --release
        shell: pwsh

      - name: Package Windows portable (zip)
        run: |
          $buildDir = Join-Path $PWD 'build\windows\x64\runner\Release'
          if (-not (Test-Path $buildDir)) { $buildDir = Join-Path $PWD 'build\windows\runner\Release' }
          Write-Host "Packaging from $buildDir"
          if (-not (Test-Path $buildDir)) {
            Write-Error "Expected build output not found: $buildDir"
          }
          $destDir = Join-Path $PWD 'build\artifacts'
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          $portableFolder = Join-Path $destDir 'windows-portable'
          if (Test-Path $portableFolder) { Remove-Item -Recurse -Force $portableFolder }
          New-Item -ItemType Directory -Path $portableFolder | Out-Null
          Copy-Item -Path (Join-Path $buildDir '*') -Destination $portableFolder -Recurse -Force
          $zipPath = Join-Path $destDir 'windows-portable.zip'
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          Compress-Archive -Path (Join-Path $portableFolder '*') -DestinationPath $zipPath -Force
        shell: pwsh

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            build/artifacts/windows-portable.zip
            build/artifacts/windows-portable/**
name: Build Flutter APK and Windows EXE

on:
  push:
  pull_request:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
        shell: bash

      - name: Flutter pub get
        run: flutter pub get

      - name: Ensure platform folders
        run: flutter create .

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
        shell: pwsh

      - name: Flutter pub get
        run: flutter pub get
        shell: pwsh

      - name: Ensure platform folders
        run: flutter create .
        shell: pwsh

      - name: Build Windows (release)
        run: flutter build windows --release
        shell: pwsh

      - name: Upload Windows portable (Release folder)
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            build/windows/x64/runner/Release
            build/windows/arm64/runner/Release
            build/windows/runner/Release
          if-no-files-found: warn

      - name: Upload Windows EXE (convenience)
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/windows/**/runner/Release/*.exe
          if-no-files-found: error

      - name: Package Windows portable as ZIP(s)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (Test-Path 'build/windows/x64/runner/Release') {
            Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'dist/windows-portable-x64.zip' -Force
          }
          if (Test-Path 'build/windows/arm64/runner/Release') {
            Compress-Archive -Path 'build/windows/arm64/runner/Release/*' -DestinationPath 'dist/windows-portable-arm64.zip' -Force
          }
          if (Test-Path 'build/windows/runner/Release') {
            Compress-Archive -Path 'build/windows/runner/Release/*' -DestinationPath 'dist/windows-portable-unknown.zip' -Force
          }

      - name: Upload Windows portable ZIP(s)
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-zip
          path: dist/*.zip
          if-no-files-found: warn

  web:
    name: Web (GitHub Pages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable web support
        run: flutter config --enable-web
        shell: bash

      - name: Ensure web platform folder
        run: flutter create . --platforms web
        shell: bash

      - name: Flutter pub get
        run: flutter pub get
        shell: bash

      - name: Build Web (release, GitHub Pages base href)
        run: flutter build web --release --base-href=/${{ github.event.repository.name }}/
        shell: bash

      - name: Make Pages-compatible tweaks
        run: |
          touch build/web/.nojekyll
          cp build/web/index.html build/web/404.html
        shell: bash

      - name: Snapshot Pages build
        run: |
          mkdir -p build/web-pages
          cp -R build/web/* build/web-pages/
        shell: bash

      - name: Prepare local preview build (adjust base href)
        run: |
          mkdir -p build/web-local
          cp -R build/web/* build/web-local/
          sed -i 's|<base href="[^"]*"|<base href="./"|' build/web-local/index.html
        shell: bash

      - name: Upload Web (GitHub Pages) artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: build/web-pages/**

      - name: Upload Web (local preview) artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-local
          path: build/web-local/**

name: Build Android APK (Expo Prebuild)

on:
  workflow_dispatch:
  push:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: | 
          yes | sdkmanager --licenses

      - name: Install project dependencies
        run: |
          npm install

      - name: Ensure compatible Expo packages installed
        run: |
          npx expo install expo-barcode-scanner @react-native-async-storage/async-storage react-native-svg react-native-safe-area-context
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Prebuild native Android project (no Expo account required)
        run: |
          npx expo prebuild --platform android --non-interactive
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Build debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# NOTE: GitHub only executes workflows from the repository root at .github/workflows.
# This copy is included inside the app folder for convenience/documentation.
# The active workflow file is at: /.github/workflows/flutter-ci.yml

name: Build Flutter APK and Windows EXE

on:
  push:
    branches:
      - main
      - '**'
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android platform (if missing)
        run: flutter create --platforms=android .

      - name: Ensure CAMERA permission in AndroidManifest
        shell: bash
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if grep -q 'android.permission.CAMERA' "$MANIFEST"; then
            echo "Camera permission already present"
          else
            echo "Adding CAMERA permission to $MANIFEST"
            # Insert uses-permission after <manifest ...> line
            sed -i '/<manifest /a \\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          fi

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Windows platform (if missing)
        run: flutter create --platforms=windows .

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Archive Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = "build/windows/x64/runner/Release"
          $zip = "Windows-InventoryScanner.zip"
          if (!(Test-Path $src)) { throw "Build output not found: $src" }
          Compress-Archive -Path "$src/*" -DestinationPath $zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: Windows-InventoryScanner.zip
          if-no-files-found: error

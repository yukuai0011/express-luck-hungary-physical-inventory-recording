name: Build React Native APK and Windows package

on:
  push:
  pull_request:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platforms
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
        shell: bash

      - name: Initialize React Native app (RN 0.73)
        run: npx @react-native-community/cli@latest init ExpressLuckInventory --version 0.73.9

      - name: Install app dependencies
        working-directory: ExpressLuckInventory
        run: |
          npm install --no-audit --no-fund
          npm install nativewind tailwindcss tailwindcss-react-native classnames @react-native-async-storage/async-storage react-native-permissions --save
          npm install react-native-vision-camera@3.9.2 @mgcrea/vision-camera-barcode-scanner@0.10.1 react-native-worklets-core --save

      - name: Copy source and configs
        run: node ci/setup.js ExpressLuckInventory

      - name: Adjust Android minSdk and Kotlin version
        run: |
          echo "REACT_NATIVE_MIN_SDK_VERSION=24" >> ExpressLuckInventory/android/gradle.properties
          sed -i 's/kotlin(\"android\") version \"[0-9.]*\"/kotlin("android") version "1.9.24"/g' ExpressLuckInventory/android/build.gradle || true
          sed -i 's/id(\"org.jetbrains.kotlin.android\") version \"[0-9.]*\"/id("org.jetbrains.kotlin.android") version "1.9.24"/g' ExpressLuckInventory/android/build.gradle || true
        shell: bash

      - name: Ensure camera permission in AndroidManifest
        run: |
          if ! grep -q "android.permission.CAMERA" ExpressLuckInventory/android/app/src/main/AndroidManifest.xml; then \
            sed -i '0,/<manifest/!b;//!{p;:a;N;$!ba;s/<manifest[^>]*>/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">/}' ExpressLuckInventory/android/app/src/main/AndroidManifest.xml; \
            sed -i '0,/<application/ s//<uses-permission android:name="android.permission.CAMERA"\/>\n    <application/' ExpressLuckInventory/android/app/src/main/AndroidManifest.xml; \
          fi
        shell: bash

      - name: Build APK (release)
        working-directory: ExpressLuckInventory/android
        run: ./gradlew assembleRelease --stacktrace --info

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: ExpressLuckInventory/android/app/build/outputs/apk/release/app-release.apk

  windows:
    name: Windows package
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize React Native app (RN 0.73)
        run: npx @react-native-community/cli@latest init ExpressLuckInventory --version 0.73.9
        shell: pwsh

      - name: Install app dependencies
        working-directory: ExpressLuckInventory
        run: |
          npm install --no-audit --no-fund
          npm install nativewind tailwindcss tailwindcss-react-native classnames @react-native-async-storage/async-storage react-native-permissions --save
          npm install react-native-vision-camera@3.9.2 @mgcrea/vision-camera-barcode-scanner@0.10.1 react-native-worklets-core --save
        shell: pwsh

      - name: Add React Native Windows (0.73)
        working-directory: ExpressLuckInventory
        run: |
          npm install react-native-windows@0.73 --save
          npx react-native-windows-init --overwrite --language cpp
        shell: pwsh

      - name: Copy source and configs
        run: node ci/setup.js ExpressLuckInventory
        shell: pwsh

      - name: Adjust Android settings (noop on Windows)
        run: |
          if (Test-Path "ExpressLuckInventory/android/gradle.properties") {
            Add-Content -Path "ExpressLuckInventory/android/gradle.properties" -Value "REACT_NATIVE_MIN_SDK_VERSION=24"
          }
          if (Test-Path "ExpressLuckInventory/android/build.gradle") {
            $p = "ExpressLuckInventory/android/build.gradle"
            (Get-Content $p) -replace 'kotlin\("android"\) version "[0-9\.]+"','kotlin("android") version "1.9.24"' | Set-Content $p
            (Get-Content $p) -replace 'id\("org.jetbrains.kotlin.android"\) version "[0-9\.]+"','id("org.jetbrains.kotlin.android") version "1.9.24"' | Set-Content $p
          }
        shell: pwsh

      - name: Build Windows (Release + MSIX)
        working-directory: ExpressLuckInventory
        run: |
          msbuild .\windows\ExpressLuckInventory.sln /restore /p:Configuration=Release /p:AppxBundle=Always /p:UapAppxPackageBuildMode=StoreUpload
        shell: pwsh

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            ExpressLuckInventory\windows\**\AppPackages\**\*.msix*
            ExpressLuckInventory\windows\**\AppPackages\**\*.appx*

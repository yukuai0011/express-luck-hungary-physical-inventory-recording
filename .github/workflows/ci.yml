name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

defaults:
  run:
    working-directory: ./express-luck-hungary-physical-inventory-recording-public

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build web (Expo export)
        run: npx expo export --platform web --output-dir web-dist

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: ./express-luck-hungary-physical-inventory-recording-public/web-dist

name: Build Android APK (Gradle)

on:
  push:
    branches: ["**", "main"]
  pull_request:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

        # Install Android SDK and required platforms/build-tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: '35.0.0'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npx expo install --non-interactive || true

      - name: Prebuild native Android project (no Expo account required)
        env:
          EXPO_NO_TELEMETRY: "1"
        run: |
          npx expo prebuild --platform android --non-interactive

      - name: Build Android APK with Gradle
        working-directory: android
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          chmod +x gradlew || true
          ./gradlew :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build React Native Android APK

on:
  push:
  pull_request:

jobs:
  android:
    name: React Native Android (Debug APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elhInventoryRN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
        shell: bash

      - name: Install NPM dependencies
        run: |
          npm ci --no-audit --no-fund

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rn-app-debug-apk
          path: elhInventoryRN/android/app/build/outputs/apk/debug/app-debug.apk
